name: Verified BEPU dependency
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'external/bepu/**'
      - 'Directory.Build.*'
      - '.gitattributes'
      - '.github/workflows/verified-bepu.yml'
      - 'src/NovaCore.Simulation/**'
      - 'src/NovaCore.Core/**'
      - 'src/NovaCore.EphemerisFormat/**'
      - 'tests/NovaCore.BepuDependency.Tests/**'
permissions:
  contents: read
jobs:
  dependency:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.303'
      - name: Configure isolated NuGet cache
        run: |
          if (-not $env:RUNNER_TEMP) { throw 'Runner temporary directory unavailable' }
          $cache = Join-Path $env:RUNNER_TEMP 'bepu-empty-cache'
          if (Test-Path -LiteralPath $cache) { throw 'Isolated cache already exists' }
          New-Item -ItemType Directory -Path $cache | Out-Null
          if (@(Get-ChildItem -LiteralPath $cache -Force).Count -ne 0) { throw 'Isolated cache is not empty' }
          "NUGET_PACKAGES=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Isolated NuGet cache: $cache; initial entries: 0"
      - name: Select SDK and empty package sources
        run: |
          dotnet new globaljson --sdk-version 10.0.303 --roll-forward disable
          if ($LASTEXITCODE -ne 0) { throw 'SDK selection failed' }
          Set-Content NuGet.Config '<configuration><packageSources><clear /></packageSources></configuration>'
      - name: Verify archives and build dependency closure
        run: dotnet build tests/NovaCore.BepuDependency.Tests -c ${{ matrix.configuration }} -p:ContinuousIntegrationBuild=true --nologo
      - name: Inspect runtime binding
        run: dotnet run --project tests/NovaCore.BepuDependency.Tests -c ${{ matrix.configuration }} --no-build
      - name: Publish verified dependencies
        run: dotnet publish tests/NovaCore.BepuDependency.Tests -c ${{ matrix.configuration }} --no-build -o build/bepu-published
      - name: Inspect published binding
        run: dotnet build/bepu-published/NovaCore.BepuDependency.Tests.dll
